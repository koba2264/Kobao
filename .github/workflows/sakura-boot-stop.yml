name: Boot/Stop Sakura Servers

on:
  schedule:
    # 起動: 月〜金 08:50 JST = 前日 23:50 UTC
    - cron: '00 23 * * 0-4'
    # 停止: 火〜土 01:10 JST = 前日 16:10 UTC
    - cron: '00 15 * * 1-5'
  workflow_dispatch:
    inputs:
      action:
        description: "boot or shutdown"
        required: true
        default: "boot"

concurrency:
  group: sakura-boot-stop
  cancel-in-progress: false

env:
  USACLOUD_ZONE: "tk1b"
  USACLOUD_ACCESS_TOKEN: ${{ secrets.SAKURA_TOKEN }}
  USACLOUD_ACCESS_TOKEN_SECRET: ${{ secrets.SAKURA_SECRET }}

jobs:
  # ===== 起動ジョブ =====
  boot-db:
    if: github.event_name == 'schedule' && github.event.schedule == '00 23 * * 0-4' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'boot')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install usacloud
        run: |
          curl -fsSL https://releases.usacloud.jp/usacloud/repos/install.sh | sh
          sudo mv usacloud /usr/local/bin/
          usacloud version

      - name: Boot DB server
        run: usacloud server boot --zone $USACLOUD_ZONE 113702174172  # ← DBサーバーのIDに置き換え

  boot-app:
    needs: boot-db
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            id: "113702256089"
          - name: frontend
            id: "113702179364"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install usacloud
        run: |
          curl -fsSL https://releases.usacloud.jp/usacloud/repos/install.sh | sh
          sudo mv usacloud /usr/local/bin/
          usacloud version
      - name: Boot app server
        run: usacloud server boot --zone $USACLOUD_ZONE ${{ matrix.id }}

  # ===== 停止ジョブ =====
  shutdown-app:
    if: github.event_name == 'schedule' && github.event.schedule == '00 15 * * 1-5' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'shutdown')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            id: "113702256089"
          - name: frontend
            id: "	113702179364"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install usacloud
        run: |
          curl -fsSL https://releases.usacloud.jp/usacloud/repos/install.sh | sh
          sudo mv usacloud /usr/local/bin/
          usacloud version
      - name: Stop app server
        run: usacloud server stop --zone $USACLOUD_ZONE ${{ matrix.id }}

  shutdown-db:
    needs: shutdown-app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install usacloud
        run: |
          curl -fsSL https://releases.usacloud.jp/usacloud/repos/install.sh | sh
          sudo mv usacloud /usr/local/bin/
          usacloud version
      - name: Stop DB server
        run: usacloud server stop --zone $USACLOUD_ZONE 113702174172  # ← DBサーバーのIDに置き換え
